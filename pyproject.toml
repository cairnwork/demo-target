[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "tinyledger"
version = "0.1.0"
description = "Tiny standard-library ledger used as a Cairnwork demo target."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/tinyledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
